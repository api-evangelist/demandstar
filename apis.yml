aid: demandstar
name: Demandstar
description: >-
  DemandStar (now Euna OpenBids) is a shared supplier network for government
  eProcurement that has connected local, county, and state government agencies
  with business suppliers since 1998. Government agencies publish bids, RFPs, and
  solicitations to the network for free, while suppliers subscribe to receive
  automated notifications about relevant opportunities matched through more than
  9,000 commodity codes, download bid packages, and submit electronic bid
  responses online. The platform spans roughly 700 participating agencies and a
  network of over 150,000 registered suppliers, offering free and paid supplier
  tiers ($99-$299/month depending on geographic coverage) plus per-document
  service fees. DemandStar is now part of Euna Solutions and rebranding as Euna
  OpenBids as part of a broader public-procurement ecosystem.
